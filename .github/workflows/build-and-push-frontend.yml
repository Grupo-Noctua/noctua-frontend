name: Build and Push Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        id: build
        uses: docker/build-push-action@v4
        with:
          # In this repo the frontend code and Dockerfile are at the repository root
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/noctua-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/noctua-frontend:${{ github.sha }}
          # platforms: linux/amd64   # descomente se precisar forçar arquit. (não necessário normalmente)

      - name: Save digest to file
        run: |
          echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}" > image_digest.txt
          cat image_digest.txt

      - name: Upload digest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image-digest
          path: image_digest.txt
